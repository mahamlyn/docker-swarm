- hosts: all
  gather_facts: true
  become: yes
  become_method: sudo
  become_user: root
  vars:
    ansible_host_key_checking: false

  tasks:
# ---- System Peperation Tasks ----
    - name: System Preparation | Patch and update the system
      import_tasks: tasks/system-updates.yaml

    - name: System Preparation | Include system configuration tasks
      import_tasks: tasks/system-config.yaml

