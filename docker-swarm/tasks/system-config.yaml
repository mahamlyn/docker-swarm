---
# System Configuraiotn - This task will perform some basic system configuration tasks.

#--------------------- INSTALL BASIC PACKAGES --------------------
    - name: Install packages
      ansible.builtin.apt:
        name:
          - prometheus-node-exporter
          - zip
          - unzip
          - net-tools

#--------------------- SYSTEM MANAGMENT TASKS --------------------
    - name: System Managment | Configure the timezone
      community.general.timezone:
        name: 'Australia/Adelaide'

#--------------------- UPDATE SSHD_CONFIG --------------------
    # Stop the SSHD Service
    - name: Services | Stop ssh Service
      ansible.builtin.command:
        cmd: systemctl stop sshd

    # Update sshd_config file with relevant settings
    - name: Login Grace time
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#LoginGraceTime'
        line: 'LoginGraceTime 60m'

    - name: Disable SSH root login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#PermitRootLogin'
        line: 'PermitRootLogin no'

    - name: Max Auth Retries
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#MaxAuthTries'
        line: 'MaxAuthTries 4'

    - name: Permit Empty Password
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#PermitEmptyPasswords'
        line: 'PermitEmptyPasswords no'

    - name: Allow TCP Forwarding
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#AllowTcpForwarding'
        line: 'AllowTcpForwarding no'
    
    - name: X11Forwarding
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#X11Forwarding'
        line: 'X11Forwarding no'

    - name: UseDNS
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#UseDNS'
        line: 'UseDNS no'

    # Start the SSHD Service
    - name: Services | Stop ssh Service
      ansible.builtin.command:
        cmd: systemctl start sshd